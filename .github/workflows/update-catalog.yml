name: Update catalog

# Rebuilds the published snapshot weekly. Clients pick the new file up
# through a conditional request, so an update reaches them without an app
# release.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the catalog from OpenStreetMap
        run: ./build-catalog.sh

      - name: Commit the snapshot when it changed
        run: |
          if git diff --quiet -- docs/it-cameras.json; then
            echo "Catalog unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/it-cameras.json
          git commit -m "Update catalog from OpenStreetMap"
          git push
